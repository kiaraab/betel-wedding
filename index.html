    <button class="foot-ic" id="bellBtn" aria-label="What’s new" title="What’s new" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 1.5H5zM10 20.2a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><i class="bell-dot" hidden></i></button>

  <!-- Passcode screen (keeps casual visitors out; files are still public in the GitHub repo) -->
  <div class="gate" id="gate" hidden>
    <div class="gate-card" id="gateCard" role="group" aria-label="Enter the passcode">
      <h1>Betel &amp; Carter Griffin</h1>
      <p class="gate-script">are getting married</p>
      <div class="pin-dots" id="pinDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="gate-err" id="gateErr" role="alert" aria-live="assertive"></p>
      <div class="pin-pad" id="pinPad">
        <button type="button" data-d="1" aria-label="1">1</button><button type="button" data-d="2" aria-label="2">2</button><button type="button" data-d="3" aria-label="3">3</button><button type="button" data-d="4" aria-label="4">4</button><button type="button" data-d="5" aria-label="5">5</button><button type="button" data-d="6" aria-label="6">6</button><button type="button" data-d="7" aria-label="7">7</button><button type="button" data-d="8" aria-label="8">8</button><button type="button" data-d="9" aria-label="9">9</button>
        <button type="button" class="pin-hint-btn" id="pinHint" aria-label="Hint" title="Hint"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9.5 18h5M10 21h4M12 3.5a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.2 1.1 2.2h5c0-1 .4-1.6 1.1-2.2A6 6 0 0 0 12 3.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" data-d="0" aria-label="0">0</button>
        <button type="button" class="pin-del" id="pinDel" aria-label="Delete"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 6h10a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 18H9l-5-6zM12 9.5l5 5M17 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <p class="pin-hint" id="pinHintText" hidden>Hint: the day he proposed, MMDD</p>
    </div>
    <p class="gate-corner">June 17, 2027 &middot; Morais Vineyards</p>
  </div>
  <script type="module">
    const HASH = '79d9d8f002c1c955fa0d21eeaaf2ebf03c3a878d2fdcb6e78d915b3ed81cc886';
    const KEY = 'bc-unlocked-pin';
    const sha = async (t) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map((b) => b.toString(16).padStart(2, '0')).join('');
    const gate = document.getElementById('gate');
    const enter = () => { document.body.classList.remove('locked'); import('./js/app.js'); };
    let ok = false;
    try { ok = localStorage.getItem(KEY) === HASH && !/[?&]gate(?:[=&#]|$)/.test(location.search); } catch { /* storage blocked: ask every time */ }
    if (ok) { gate.remove(); enter(); }
    else {
      gate.hidden = false;
      const card = document.getElementById('gateCard'), dots = [...document.querySelectorAll('#pinDots i')], err = document.getElementById('gateErr');
      let pin = '', busy = false;
      const paint = () => dots.forEach((d, i) => d.classList.toggle('on', i < pin.length));
      const press = async (d) => {
        if (busy || pin.length >= 4) return;
        pin += d; err.textContent = ''; paint();
        if (pin.length < 4) return;
        busy = true;
        if (await sha(pin) === HASH) {
          try { localStorage.setItem(KEY, HASH); } catch { /* remembered for this visit only */ }
          card.classList.add('unlocked');
          // the four dots turn into little hearts, then a few tiny hearts drift up as the screen opens
          const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.7a4.3 4.3 0 0 1 7.5 2.8c0 5.4-7.5 10-7.5 10z" fill="currentColor"/></svg>';
          dots.forEach((d, i) => { d.innerHTML = HEART; d.classList.add('heart'); d.style.animationDelay = i * 90 + 'ms'; });
          const row = document.getElementById('pinDots');
          for (let k = 0; k < 7; k++) { const f = document.createElement('span'); f.className = 'pin-float'; f.innerHTML = HEART; f.style.left = 6 + k * 14 + '%'; f.style.animationDelay = 380 + k * 70 + 'ms'; f.style.setProperty('--dx', (k % 2 ? 1 : -1) * (6 + k * 2) + 'px'); row.append(f); }
          setTimeout(() => { gate.classList.add('open'); enter(); setTimeout(() => gate.remove(), 900); }, 1250);
        } else {
          err.textContent = 'That is not it. Try again.';
          card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
          setTimeout(() => { pin = ''; paint(); busy = false; card.classList.remove('shake'); }, 420);
        }
      };
      const del = () => { if (!busy) { pin = pin.slice(0, -1); paint(); } };
      document.getElementById('pinPad').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.d) press(b.dataset.d); else if (b.id === 'pinDel') del(); });
      document.getElementById('pinHint').onclick = () => { const t = document.getElementById('pinHintText'); t.hidden = !t.hidden; };
      document.addEventListener('keydown', (e) => { if (!document.getElementById('gate')) return; if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') del(); });
    }
  </script>
