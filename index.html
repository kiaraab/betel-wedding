  <!-- Password screen (keeps casual visitors out; files are still public in the GitHub repo) -->
  <div class="gate" id="gate" hidden>
    <form class="gate-card" id="gateForm" autocomplete="off">
      <p>June 17, 2027 · Morais Vineyards</p>
      <h1>Betel &amp; Carter</h1>
      <p class="gate-script">are getting married</p>
      <label class="sr" for="gatePw">Password</label>
      <input id="gatePw" type="password" placeholder="Password" autofocus />
      <button type="submit" aria-label="Enter">&rarr;</button>
    </form>
  </div>
  <script type="module">
    const HASH = 'a5246b03e83a72386b42c62b3d945e5d153c2fcef3b9a72a4f4de5018624a700';
    const KEY = 'bc-unlocked';
    const sha = async (s) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map((b) => b.toString(16).padStart(2, '0')).join('');
    const gate = document.getElementById('gate');
    const enter = () => { document.body.classList.remove('locked'); import('./js/app.js'); };
    let ok = false;
    try { ok = localStorage.getItem(KEY) === HASH && !/[?&]gate/.test(location.search); } catch { /* storage blocked: ask every time */ }
    if (ok) { gate.remove(); enter(); }
    else {
      gate.hidden = false;
      document.getElementById('gateForm').onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('gatePw');
        if (await sha(input.value.trim().toLowerCase()) === HASH) {
          try { localStorage.setItem(KEY, HASH); } catch { /* remembered for this visit only */ }
          gate.classList.add('open');
          enter();
          setTimeout(() => gate.remove(), 700);
        } else {
          input.value = '';
          gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
        }
      };
    }
  </script>
